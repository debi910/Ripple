<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ripple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/static/style.css?v=5">
</head>
<body>
<header class="top">
  <a class="brand" href="#bill" aria-label="Ripple home">
    <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
      <circle cx="16" cy="16" r="3.2" class="r0"/><circle cx="16" cy="16" r="8.5" class="r1"/><circle cx="16" cy="16" r="14" class="r2"/>
    </svg>
    Ripple
  </a>
  <nav aria-label="Chapters">
    <button data-view="bill"><i>01</i>The bill</button>
    <button data-view="recount"><i>02</i>Recount</button>
    <button data-view="episode"><i>03</i>Ripple</button>
    <button data-view="makegood"><i>04</i>Make good</button>
    <button data-view="proof"><i>05</i>Proof</button>
  </nav>
  <div class="live" title="Time Exasol took to answer this view"><span class="dot"></span>Exasol <b id="ms">–</b> ms</div>
</header>

<main>
  <section id="view-bill" class="view"></section>
  <section id="view-recount" class="view"></section>
  <section id="view-episode" class="view"></section>
  <section id="view-makegood" class="view"></section>
  <section id="view-proof" class="view"></section>
</main>

<aside id="drawer" class="drawer" aria-hidden="true">
  <button class="close" id="drawer-close" aria-label="Close">×</button>
  <div id="drawer-body"></div>
</aside>
<div id="scrim" class="scrim"></div>

<script src="/static/app.js?v=5"></script>
</body>
</html>
